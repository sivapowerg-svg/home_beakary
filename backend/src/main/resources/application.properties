# Spring Boot Application Configuration for Sweet Crumbs Bakery
server.port=8080

spring.application.name=Sweet Crumbs Home Bakery

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Configuration (MySQL / PostgreSQL / H2)
# By default, uses local H2 memory DB for quick testing, or configure MySQL/Postgres below:
# For MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/sweetcrumbs_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/sweetcrumbs_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Default In-Memory / File H2 DB for zero-config demonstration:
spring.datasource.url=jdbc:h2:mem:sweetcrumbs;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS configuration
sweetcrumbs.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
